name: heritage-guide

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    volumes:
      - ./data/processed/aks_bm25_v1.sqlite3:/data/aks_bm25_v1.sqlite3:ro
      - ./data/processed/aks_article_medias.jsonl:/data/aks_article_medias.jsonl:ro
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}"
      AKS_BM25_INDEX_PATH: /data/aks_bm25_v1.sqlite3
      AKS_MEDIA_JSONL_PATH: /data/aks_article_medias.jsonl
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
