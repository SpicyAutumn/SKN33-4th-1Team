# 메인 EC2 전용 HTTPS 설정. 인증서는 서버에서 발급하고 Git에 넣지 않는다.
# 로컬 개발용 docker-compose.yml의 8081:80 연결은 그대로 유지한다.
services:
  backend:
    environment:
      DJANGO_ALLOWED_HOSTS: "skn33heritage.site,3.34.183.171,localhost,127.0.0.1,backend"
      DJANGO_COOKIE_SECURE: "true"
      DJANGO_TRUST_PROXY_SSL: "true"
  frontend:
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/www/letsencrypt:/var/www/letsencrypt:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
