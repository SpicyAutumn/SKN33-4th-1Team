server {
    listen 80;
    server_name skn33heritage.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://skn33heritage.site$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name skn33heritage.site;

    ssl_certificate /etc/letsencrypt/live/skn33heritage.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skn33heritage.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ^~ /share/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
