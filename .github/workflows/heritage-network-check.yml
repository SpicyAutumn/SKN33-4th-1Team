name: Heritage network checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Django==5.2.17
      - run: python -m unittest discover -s tests -p "test_heritage_*.py"
      - run: python -m unittest discover -s backend/network_tests -p "test_*.py"
        env:
          PYTHONPATH: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node --test tests/heritageNetwork.test.js
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
