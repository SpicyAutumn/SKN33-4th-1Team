name: Heritage network checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Django==5.2.17
      # Common Python tests and frontend checks cover the shared tests/build.
      # Keep this workflow name/job stable for existing required-check settings.
      - run: python -m unittest discover -s backend/network_tests -p "test_*.py"
        env:
          PYTHONPATH: backend
