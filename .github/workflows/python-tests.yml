name: Python tests

on:
  pull_request:
  push:
    branches:
      - main
      - part_a_ksj_*

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Install backend unit test dependencies
        run: python -m pip install -r backend/requirements-test.txt

      - name: Run backend API unit tests
        env:
          PYTHONPATH: backend
          DJANGO_SETTINGS_MODULE: config.test_settings
        run: python -m unittest discover -s backend/api/tests -p "test_*.py"

      - name: Run search link API integration tests
        run: python backend/manage.py test api.link_tests --settings=config.search_links_test_settings

      - name: Run semantic verifier experiment tests (offline)
        run: python -X utf8 -B -m unittest discover -s experiments/semantic_verifier -p "test_*.py"
