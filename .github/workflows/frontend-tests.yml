name: Frontend checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check:clarification
      - run: node scripts/check-question-retry.cjs
      - run: node scripts/check-report.mjs
      - run: node scripts/check-answer-media.cjs
      - run: node scripts/check-heritage-loading.cjs
      - run: npm run build
