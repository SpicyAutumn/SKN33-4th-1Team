{% extends 'base.html' %}
{% block title %}마이페이지 | 문화유산 AI 가이드{% endblock %}
{% block content %}
<section class="content-section">
  <p class="eyebrow dark">MY PAGE</p>
  <h1>{{ user.username }} 님, 반갑습니다.</h1>
  <div class="profile-card">
    <dl><dt>아이디</dt><dd>{{ user.username }}</dd></dl>
    <dl><dt>이메일</dt><dd>{{ user.email }}</dd></dl>
    <dl><dt>가입일</dt><dd>{{ user.date_joined|date:"Y년 n월 j일" }}</dd></dl>
  </div>
  <p class="hint">다음 단계에서 질문 기록·저장 목록·오류 제보를 이 회원 계정에 연결합니다.</p>
</section>
{% endblock %}
