{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}문화유산 AI 가이드{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'heritage:home' %}">문화유산 AI 가이드</a>
    <nav>
      <a href="{% url 'heritage:home' %}">홈</a>
      {% if user.is_authenticated %}
        <a href="{% url 'heritage:mypage' %}">마이페이지</a>
        <form action="{% url 'accounts:logout' %}" method="post">
          {% csrf_token %}<button type="submit" class="link-button">로그아웃</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:login' %}">로그인</a>
        <a class="member-link" href="{% url 'accounts:signup' %}">회원가입</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
