{% extends 'base.html' %}
{% block title %}회원가입 | 문화유산 AI 가이드{% endblock %}
{% block content %}
<section class="auth-page"><div class="auth-card">
  <p class="eyebrow dark">ACCOUNT</p>
  <h1>회원가입</h1>
  <p>이메일, 아이디, 비밀번호로 계정을 만듭니다.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}
      <label>{{ field.label }}{{ field }}{% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}</label>
    {% endfor %}
    {% for error in form.non_field_errors %}<p class="error">{{ error }}</p>{% endfor %}
    <button class="primary wide" type="submit">회원가입</button>
  </form>
  <p class="hint">이미 계정이 있나요? <a href="{% url 'accounts:login' %}">로그인</a></p>
</div></section>
{% endblock %}
