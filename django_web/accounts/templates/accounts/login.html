{% extends 'base.html' %}
{% block title %}로그인 | 문화유산 AI 가이드{% endblock %}
{% block content %}
<section class="auth-page"><div class="auth-card">
  <p class="eyebrow dark">ACCOUNT</p>
  <h1>로그인</h1>
  <p>아이디 또는 이메일과 비밀번호를 입력해 주세요.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}
      <label>{{ field.label }}{{ field }}{% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}</label>
    {% endfor %}
    {% for error in form.non_field_errors %}<p class="error">{{ error }}</p>{% endfor %}
    <button class="primary wide" type="submit">로그인</button>
  </form>
  <p class="hint">아직 계정이 없나요? <a href="{% url 'accounts:signup' %}">회원가입</a></p>
</div></section>
{% endblock %}
